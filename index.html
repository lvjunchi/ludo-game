<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>情侣飞行棋</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c2185b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>
  <div class="bg-animation" id="bgAnimation"></div>
  <div class="game-container">
    <h1>情侣飞行棋</h1>

    <div class="photo-board-wrapper">
      <div class="photo-column">
        <div class="photo-card" id="photo1" onclick="openPhotoEditor(1)">
          <div class="photo-placeholder">🐺</div>
          <span class="photo-label">鹿角虫</span>
        </div>
        <div class="photo-card" id="photo2" onclick="openPhotoEditor(2)">
          <div class="photo-placeholder">🐷</div>
          <span class="photo-label">小曦曦</span>
        </div>
      </div>
      <div class="game-board" id="gameBoard"></div>
    </div>

    <div class="controls">
      <div class="player-info player1 active">
        <span class="player-name" id="playerName1">🐺 鹿角虫</span>
        <span class="piece-indicator"></span>
      </div>

      <div class="dice-area" onclick="rollDice()">
        <div class="dice" id="dice"></div>
      </div>

      <div class="player-info player2">
        <span class="player-name" id="playerName2">🐷 小曦曦</span>
        <span class="piece-indicator"></span>
      </div>

      <button class="reset-btn" onclick="resetGame()">重新开始</button>
    </div>

    <div class="toolbar">
      <button class="tool-btn" onclick="openEditor()">✏️ 事件</button>
      <button class="tool-btn" onclick="openPlayerEditor()">🎮 玩家</button>
      <button class="tool-btn" onclick="openStats()">📊 统计</button>
      <button class="tool-btn" id="firstBtn" onclick="toggleFirst()">先手: 🐺</button>
      <button class="tool-btn" id="themeBtn" onclick="toggleTheme()">☀️ 浅色</button>
      <button class="tool-btn" id="bgBtn" onclick="toggleBgAnimation()">🌸 背景</button>
    </div>

    <div class="message" id="gameMessage">🐺 vs 🐷 点击骰子开始</div>
  </div>

  <!-- 事件编辑器弹窗 -->
  <div class="editor-overlay" id="editorOverlay" onclick="closeEditor(event)">
    <div class="editor-box">
      <h2>编辑格子事件</h2>
      <div class="preset-bar" id="presetBar"></div>
      <div class="editor-list" id="editorList"></div>
      <div class="editor-actions">
        <button class="editor-btn save" onclick="saveEvents()">💾 保存</button>
        <button class="editor-btn reset" onclick="resetEvents()">🔄 恢复默认</button>
        <button class="editor-btn cancel" onclick="closeEditor()">取消</button>
      </div>
    </div>
  </div>

  <!-- 照片编辑器弹窗 -->
  <div class="editor-overlay" id="photoEditorOverlay" onclick="closePhotoEditor(event)">
    <div class="editor-box">
      <h2 id="photoEditorTitle">设置照片</h2>
      <div class="photo-editor-content">
        <div class="photo-preview" id="photoPreview"></div>
        <label class="photo-upload-btn" for="photoFileInput">📁 从本地选择图片</label>
        <input type="file" id="photoFileInput" accept="image/*" style="display:none">
        <input type="text" id="photoUrlInput" placeholder="或输入图片 URL" class="photo-url-input">
      </div>
      <div class="editor-actions">
        <button class="editor-btn save" onclick="savePhoto()">💾 保存</button>
        <button class="editor-btn reset" onclick="clearPhoto()">🔄 清除</button>
        <button class="editor-btn cancel" onclick="closePhotoEditor()">取消</button>
      </div>
    </div>
  </div>

  <!-- 玩家编辑器 -->
  <div class="editor-overlay" id="playerEditorOverlay" onclick="closePlayerEditor(event)">
    <div class="editor-box" style="max-width:380px">
      <h2>🎮 自定义玩家</h2>
      <div class="photo-editor-content" style="gap:16px">
        <div class="player-edit-section">
          <div style="font-weight:bold;color:#e53935;margin-bottom:6px">玩家 1</div>
          <input type="text" id="p1Name" class="photo-url-input" placeholder="名称" maxlength="10">
          <input type="text" id="p1Icon" class="photo-url-input" placeholder="图标（Emoji）" maxlength="2" style="margin-top:6px">
        </div>
        <div class="player-edit-section">
          <div style="font-weight:bold;color:#42a5f5;margin-bottom:6px">玩家 2</div>
          <input type="text" id="p2Name" class="photo-url-input" placeholder="名称" maxlength="10">
          <input type="text" id="p2Icon" class="photo-url-input" placeholder="图标（Emoji）" maxlength="2" style="margin-top:6px">
        </div>
      </div>
      <div class="editor-actions">
        <button class="editor-btn save" onclick="savePlayerEditor()">💾 保存</button>
        <button class="editor-btn cancel" onclick="closePlayerEditor()">取消</button>
      </div>
    </div>
  </div>

  <!-- 统计弹窗 -->
  <div class="editor-overlay" id="statsOverlay" onclick="closeStats(event)">
    <div class="editor-box" style="max-width:360px">
      <h2>📊 游戏统计</h2>
      <div class="stats-content" id="statsContent"></div>
      <div class="editor-actions">
        <button class="editor-btn reset" onclick="resetStats()">🔄 重置统计</button>
        <button class="editor-btn cancel" onclick="closeStats()">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
